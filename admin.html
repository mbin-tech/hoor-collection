<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت حور</title>
<style>
body{font-family:sans-serif;background:#FEFAFB;padding:20px;direction:rtl}
h1{color:#B56B82;text-align:center}
.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{background:#B56B82;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;width:100%;margin-top:10px}
#loginScreen{margin-top:50px}
</style>
</head>
<body>

<div id="loginScreen" class="card">
    <h1>ورود به پنل</h1>
    <div id="loginError" style="color:red;font-size:12px;text-align:center"></div>
    <input type="email" id="email" placeholder="ایمیل">
    <input type="password" id="password" placeholder="رمز عبور">
    <button onclick="login()">ورود</button>
</div>

<div id="adminPanel" style="display:none">
    <h1>پنل مدیریت</h1>
    <button onclick="logout()" style="background:#fce4e4;color:#c00;margin-bottom:10px">خروج</button>
    
    <div class="card">
        <h3>تنظیمات سایت</h3>
        <label>متن هدر:</label>
        <input type="text" id="set-hero-text">
        <label>درباره ما:</label>
        <textarea id="set-about-text" rows="3"></textarea>
        <label>شماره تماس:</label>
        <input type="text" id="set-phone">
        <button onclick="saveSettings()">ذخیره تنظیمات</button>
    </div>

    <div class="card">
        <h3>افزودن محصول</h3>
        <label>نام:</label>
        <input type="text" id="p-name">
        <label>قیمت:</label>
        <input type="number" id="p-price">
        <label>دسته:</label>
        <select id="p-cat">
            <option value="هودی و کت">هودی و کت</option>
            <option value="بلوز">بلوز</option>
            <option value="دورس">دورس</option>
            <option value="اکسسوری">اکسسوری</option>
        </select>
        <label>موجودی:</label>
        <input type="number" id="p-stock">
        <label>لینک عکس:</label>
        <input type="text" id="p-img" placeholder="https://...">
        <button onclick="addProduct()">افزودن محصول</button>
    </div>

    <div class="card">
        <h3>لیست محصولات</h3>
        <div id="list"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var db = null;
var SUPABASE_URL = 'https://qcxtxuesbvuhraokyzyu.supabase.co';
var SUPABASE_KEY = 'sb_publishable_yCHUbgjbnsMNlZWlimYJQg_LlzkSpyE';

window.onload = function() {
    if (typeof window.supabase === 'undefined') {
        document.getElementById('loginError').textContent = 'کتابخانه Supabase لود نشد. VPN را روشن کنید.';
        return;
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log("DB connected");
}

async function login() {
    if (!db) return alert('اتصال به دیتابیس برقرار نیست');
    var email = document.getElementById('email').value;
    var pass = document.getElementById('password').value;
    var res = await db.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) {
        document.getElementById('loginError').textContent = res.error.message;
        return;
    }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadProducts();
    loadSettings();
}

async function logout() {
    await db.auth.signOut();
    location.reload();
}

async function loadProducts() {
    var res = await db.from('products').select('*');
    if (res.error) return;
    var list = document.getElementById('list');
    list.innerHTML = '';
    res.data.forEach(function(p) {
        list.innerHTML += '<div style="border-bottom:1px solid #eee;padding:5px 0">' + p.name + ' - ' + p.price + ' تومان <button onclick="delProduct(\'' + p.id + '\')" style="background:red;width:auto;margin:0;padding:2px 5px">حذف</button></div>';
    });
}

async function delProduct(id) {
    if (!confirm('حذف شود؟')) return;
    await db.from('products').delete().eq('id', id);
    loadProducts();
}

async function addProduct() {
    var name = document.getElementById('p-name').value;
    var price = document.getElementById('p-price').value;
    var cat = document.getElementById('p-cat').value;
    var stock = document.getElementById('p-stock').value;
    var img = document.getElementById('p-img').value;
    
    if (!name || !price) return alert('نام و قیمت الزامی است');
    
    await db.from('products').insert([{
        name: name, price: price, category: cat, stock: stock, image: img, active: true
    }]);
    
    alert('محصول اضافه شد');
    loadProducts();
}

async function loadSettings() {
    var res = await db.from('settings').select('*').eq('id', 1).single();
    if (res.data) {
        document.getElementById('set-hero-text').value = res.data.hero_text || '';
        document.getElementById('set-about-text').value = res.data.about_text || '';
        document.getElementById('set-phone').value = res.data.phone || '';
    }
}

async function saveSettings() {
    var hero = document.getElementById('set-hero-text').value;
    var about = document.getElementById('set-about-text').value;
    var phone = document.getElementById('set-phone').value;
    
    await db.from('settings').update({
        hero_text: hero, about_text: about, phone: phone
    }).eq('id', 1);
    
    alert('تنظیمات ذخیره شد');
}
</script>
</body>
</html>
