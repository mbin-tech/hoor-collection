
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت حور کالکشن</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#FEFAFB;color:#493943;font-family:Tahoma,sans-serif}
h1{color:#B56B82;text-align:center}
h2{color:#B56B82;font-size:19px}
.card{background:white;border:1px solid #f1e2e8;border-radius:18px;padding:20px;margin:16px auto;max-width:800px;box-shadow:0 5px 18px #b56b8210}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ead7df;border-radius:10px;background:#fffafd;font:inherit}
button{background:#B56B82;color:white;border:0;padding:12px 16px;border-radius:10px;font:inherit;cursor:pointer;margin:4px}
button:disabled{opacity:.5}
.danger{background:#d94b5b}
.light{background:#f8e8ed;color:#85445b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.product img{width:75px;height:85px;object-fit:cover;border-radius:10px}
.product-info{flex:1;min-width:0}
.muted{font-size:12px;color:#888}
#adminPanel{display:none}
#loginScreen{max-width:550px;margin:50px auto}
#loginError,.error{color:#c62828;font-size:13px}
@media(max-width:550px){.grid{grid-template-columns:1fr}.card{padding:15px}.product img{width:60px;height:70px}}
</style>
</head>
<body>

<div id="loginScreen" class="card">
<h1>🔐 ورود به پنل حور</h1>
<div id="loginError"></div>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">
<button id="loginBtn" onclick="login()" style="width:100%">ورود</button>
</div>

<div id="adminPanel">

<h1>پنل مدیریت حور کالکشن 💗</h1>
<div class="card">
<button onclick="refreshAll()">به‌روزرسانی</button>
<button class="danger" onclick="logout()">خروج</button>
</div>

<div class="card">
<h2>⚙️ تنظیمات فروشگاه</h2>
<label>متن هدر</label>
<input id="set-hero-text">
<label>درباره ما</label>
<textarea id="set-about-text" rows="4"></textarea>
<label>شماره تماس</label>
<input id="set-phone">
<button onclick="saveSettings()" style="width:100%">ذخیره تنظیمات</button>
</div>

<div class="card">
<h2 id="formTitle">➕ افزودن محصول</h2>
<input type="hidden" id="p-id">

<label>نام محصول</label>
<input id="p-name" placeholder="نام محصول">

<div class="grid">
<div>
<label>قیمت (تومان)</label>
<input id="p-price" type="number" min="0">
</div>
<div>
<label>قیمت قبل از تخفیف</label>
<input id="p-old-price" type="number" min="0" placeholder="اختیاری">
</div>
<div>
<label>دسته‌بندی</label>
<select id="p-cat">
<option value="هودی و کت">هودی و کت</option>
<option value="بلوز">بلوز</option>
<option value="دورس">دورس</option>
<option value="اکسسوری">اکسسوری</option>
</select>
</div>
<div>
<label>موجودی</label>
<input id="p-stock" type="number" min="0" value="0">
</div>
</div>

<label>لینک عکس اصلی</label>
<input id="p-img" type="url" placeholder="https://...">

<label>توضیحات محصول</label>
<textarea id="p-description" rows="3" placeholder="توضیحات محصول"></textarea>

<div class="grid">
<div>
<label>رنگ‌ها</label>
<input id="p-colors" placeholder="مثلاً مشکی، سفید، صورتی">
</div>
<div>
<label>سایزها</label>
<input id="p-sizes" placeholder="مثلاً فری‌سایز، L، XL">
</div>
</div>

<button id="saveProductBtn" onclick="saveProduct()">ثبت محصول</button>
<button class="light" onclick="clearForm()">پاک کردن فرم</button>
<div id="productMessage"></div>
</div>

<div class="card">
<h2>🛍️ مدیریت محصولات</h2>
<input id="search" placeholder="جست‌وجوی محصول..." oninput="renderProducts()">
<div id="list">در حال دریافت...</div>
<div id="productError" class="error"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qcxtxuesbvuhraokyzyu.supabase.co';
const SUPABASE_KEY='sb_publishable_yCHUbgjbnsMNlZWlimYJQg_LlzkSpyE';

let db=null;
let products=[];

window.addEventListener('load',()=>{
 if(!window.supabase){
  document.getElementById('loginError').textContent='کتابخانه Supabase بارگذاری نشد.';
  return;
 }
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
});

async function login(){
 const error=document.getElementById('loginError');
 const btn=document.getElementById('loginBtn');
 error.textContent='';
 if(!db){error.textContent='اتصال دیتابیس برقرار نیست.';return;}

 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 if(!email||!password){error.textContent='ایمیل و رمز را وارد کن.';return;}

 btn.disabled=true;
 btn.textContent='در حال ورود...';

 try{
  const {error:e}=await db.auth.signInWithPassword({email,password});
  if(e){error.textContent=e.message;return;}

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  await refreshAll();
 }catch(e){
  error.textContent='خطا در ورود: '+e.message;
 }finally{
  btn.disabled=false;
  btn.textContent='ورود';
 }
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function refreshAll(){
 await Promise.all([loadProducts(),loadSettings()]);
}

async function loadProducts(){
 const list=document.getElementById('list');
 const err=document.getElementById('productError');
 list.textContent='در حال دریافت محصولات...';
 err.textContent='';

 const {data,error}=await db.from('products').select('*');

 if(error){
  list.textContent='';
  err.textContent='خطا: '+error.message;
  return;
 }

 products=data||[];
 renderProducts();
}

function renderProducts(){
 const list=document.getElementById('list');
 const q=document.getElementById('search').value.toLowerCase().trim();
 list.innerHTML='';

 const filtered=products.filter(p=>
  String(p.name||'').toLowerCase().includes(q)
 );

 if(!filtered.length){
  list.textContent='محصولی پیدا نشد.';
  return;
 }

 filtered.forEach(p=>{
  const row=document.createElement('div');
  row.className='product';

  const img=document.createElement('img');
  img.src=p.image||'';
  img.alt=p.name||'محصول';
  img.onerror=()=>img.style.visibility='hidden';

  const info=document.createElement('div');
  info.className='product-info';

  const name=document.createElement('strong');
  name.textContent=p.name||'بدون نام';

  const detail=document.createElement('div');
  detail.className='muted';
  detail.textContent=
   Number(p.price||0).toLocaleString('fa-IR')+
   ' تومان | '+(p.category||'بدون دسته')+
   ' | موجودی: '+Number(p.stock||0);

  const edit=document.createElement('button');
  edit.className='light';
  edit.textContent='ویرایش';
  edit.onclick=()=>editProduct(p.id);

  const del=document.createElement('button');
  del.className='danger';
  del.textContent='حذف';
  del.onclick=()=>deleteProduct(p.id);

  info.append(name,detail,edit,del);
  row.append(img,info);
  list.append(row);
 });
}

function editProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;

 document.getElementById('p-id').value=p.id;
 document.getElementById('p-name').value=p.name||'';
 document.getElementById('p-price').value=p.price??'';
 document.getElementById('p-old-price').value=p.old_price??'';
 document.getElementById('p-cat').value=p.category||'هودی و کت';
 document.getElementById('p-stock').value=p.stock??0;
 document.getElementById('p-img').value=p.image||'';
 document.getElementById('p-description').value=p.description||'';
 document.getElementById('p-colors').value=Array.isArray(p.colors)?p.colors.join('، '):(p.colors||'');
 document.getElementById('p-sizes').value=Array.isArray(p.sizes)?p.sizes.join('، '):(p.sizes||'');

 document.getElementById('formTitle').textContent='✏️ ویرایش محصول';
 document.getElementById('saveProductBtn').textContent='ذخیره تغییرات';

 window.scrollTo({top:0,behavior:'smooth'});
}

function clearForm(){
 ['p-id','p-name','p-price','p-old-price','p-img','p-description','p-colors','p-sizes'].forEach(id=>{
  document.getElementById(id).value='';
 });
 document.getElementById('p-stock').value=0;
 document.getElementById('p-cat').value='هودی و کت';
 document.getElementById('formTitle').textContent='➕ افزودن محصول';
 document.getElementById('saveProductBtn').textContent='ثبت محصول';
 document.getElementById('productMessage').textContent='';
}

async function saveProduct(){
 const msg=document.getElementById('productMessage');
 const id=document.getElementById('p-id').value;

 const name=document.getElementById('p-name').value.trim();
 const price=document.getElementById('p-price').value;
 const oldPrice=document.getElementById('p-old-price').value;
 const category=document.getElementById('p-cat').value;
 const stock=document.getElementById('p-stock').value;
 const image=document.getElementById('p-img').value.trim();
 const description=document.getElementById('p-description').value.trim();
 const colors=document.getElementById('p-colors').value;
 const sizes=document.getElementById('p-sizes').value;

 if(!name||price===''||Number(price)<0||Number(stock)<0){
  msg.textContent='نام، قیمت و موجودی معتبر وارد کن.';
  return;
 }

 // فقط ستون‌هایی ارسال می‌شوند که در جدول فعلی شناخته شده‌اند.
 // فیلدهای اضافی پس از بررسی ساختار دیتابیس اضافه می‌شوند.
 const payload={
  name,
  price:Number(price),
  category,
  stock:Number(stock||0),
  image
 };

 // این فیلدها در صورت وجود ستون متناظر در جدول قابل ذخیره‌اند.
 // اگر ستون در دیتابیس وجود نداشته باشد، Supabase خطا می‌دهد.
 if(oldPrice!=='') payload.old_price=Number(oldPrice);
 if(description) payload.description=description;
 if(colors) payload.colors=colors;
 if(sizes) payload.sizes=sizes;

 let result;

 if(id){
  result=await db.from('products').update(payload).eq('id',id);
 }else{
  result=await db.from('products').insert([{...payload,active:true}]);
 }

 if(result.error){
  msg.textContent='خطا در ذخیره: '+result.error.message;
  msg.className='error';
  return;
 }

 msg.textContent='تغییرات ذخیره شد 💗';
 msg.className='';
 clearForm();
 await loadProducts();
}

async function deleteProduct(id){
 if(!confirm('محصول حذف شود؟'))return;

 const {error}=await db.from('products').delete().eq('id',id);

 if(error){
  alert('خطا در حذف: '+error.message);
  return;
 }

 await loadProducts();
}

async function loadSettings(){
 const {data,error}=await db.from('settings').select('*').eq('id',1).single();

 if(error){
  console.log(error.message);
  return;
 }

 if(data){
  document.getElementById('set-hero-text').value=data.hero_text||'';
  document.getElementById('set-about-text').value=data.about_text||'';
  document.getElementById('set-phone').value=data.phone||'';
 }
}

async function saveSettings(){
 const payload={
  hero_text:document.getElementById('set-hero-text').value,
  about_text:document.getElementById('set-about-text').value,
  phone:document.getElementById('set-phone').value
 };

 const {error}=await db.from('settings').update(payload).eq('id',1);

 if(error){
  alert('خطا در ذخیره تنظیمات: '+error.message);
  return;
 }

 alert('تنظیمات ذخیره شد 💗');
}
</script>
</body>
</html>
